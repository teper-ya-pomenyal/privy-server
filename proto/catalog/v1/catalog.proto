message SearchAlbumRequest {
    string album_name = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message SearchAlbumResponse {
    repeated Album albums = 1;
}


//
message SearchPlaylistRequest {
    string playlist_name = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message SearchPlaylistResponse {
    repeated Playlist playlists = 1;
}*/


//

message GetPlaylistByIDRequest {
    string playlist_uuid = 1;
}
message GetPlaylistByIDResponse {
    Playlist playlist = 1;
}

message GetArtistByIDRequest {
    string artist_uuid = 1;
}

message GetArtistByIDResponse {
    Artist artist = 1;
}


//
message GetAlbumByIDRequest {
    string album_uuid = 1;
}

message GetAlbumByIDResponse {
    Album album = 1;
}

//
message AddArtistRequest {
    string artist_name = 1;
}

message AddArtistResponse {
    Artist artist = 1;
}

//
message AddAlbumRequest {
    string artist_uuid = 1;
    string album_name = 2;
    string cover_path = 3;
}

message AddAlbumResponse {
    Album album = 1;
}

//
message AddTrackRequest {
    string track_name = 1;
    string artist_uuid = 2;
    string album_uuid = 3;
    bool explicit = 4;
    string track_path = 5;
    string cover_path = 6;
    int32 duration_ms = 7;
}

message AddTrackResponse {
    string track_uuid = 1;
    string track_name = 2;
    string artist_uuid = 3;
    string album_uuid = 4;
    bool explicit = 5;
    string track_path = 6;
    string cover_path = 7;
    int32 duration_ms = 8;
}

//
message AlbumTrackInput {
    string track_uuid = 1;
    int32 position = 2;
}

message AddTracksToAlbumRequest {
    string album_uuid = 1;
    repeated AlbumTrackInput tracks = 2;
}

message AddTracksToAlbumResponse {}

// Обложка — собственность альбома: путь пишется альбому и всем его трекам,
// чтобы обложка трека всегда совпадала с обложкой альбома (сингл = альбом
// с одноимённым треком, файл один).
message SetAlbumCoverRequest {
    string album_uuid = 1;
    string cover_path = 2;
}

message SetAlbumCoverResponse {}

message SetTrackCoverRequest {
    string track_uuid = 1;
    string cover_path = 2;
}

message SetTrackCoverResponse {}

// Удаление трека: вместе с вхождениями в трек-листы и плейлисты.
// Возвращает путь файла, чтобы gateway убрал его из хранилища
// (обложка не трогается — файл обложки принадлежит альбому).
message DeleteTrackRequest {
    string track_uuid = 1;
}

message DeleteTrackResponse {
    string track_path = 1;
}

// Удаление альбома: вместе со всеми его треками, позициями в трек-листах
// и вхождениями треков в плейлисты. Возвращает пути файлов хранилища
// (файлы треков и обложка), которые gateway убирает сам.
message DeleteAlbumRequest {
    string album_uuid = 1;
}

message DeleteAlbumResponse {
    repeated string track_paths = 1;
    string cover_path = 2;
}

message IncrementListenedRequest {
    string track_uuid = 1;
}

message IncrementListenedResponse {}

// Фильтр explicit: 0 — все треки, 1 — только с меткой, 2 — только без метки.
message ListTracksRequest {
    int32 explicit_filter = 1;
    int32 limit = 2;
    int32 offset = 3;
}

message ListTracksResponse {
    repeated Track tracks = 1;
    int32 total = 2;
}

message SetTrackExplicitRequest {
    string track_uuid = 1;
    bool explicit = 2;
}

message SetTrackExplicitResponse {}

message HealthRequest {}

message HealthResponse {
    bool postgres = 1;
}

message GetLogsRequest {
    int32 limit = 1;
}

message LogEntry {
    int64 at_ms = 1;
    string level = 2; // INFO | WARN | ERROR
    string method = 3; // HTTP-метод, если запись о запросе
    string path = 4; // HTTP-путь или gRPC full method
    string code = 5; // HTTP-статус или gRPC-код
    int64 ms = 6;
    string message = 7; // событие без HTTP-пар (panic, отказ)
}

message GetLogsResponse {
    repeated LogEntry entries = 1;
}
